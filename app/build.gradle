plugins {
    id "com.android.application"
}

android {
    namespace "app.animnav"
    compileSdk 36

    defaultConfig {
        applicationId "app.animnav"
        minSdk 30
        targetSdk 36
        versionCode 16
        versionName "0.16"
    }

    androidResources {
        // Material Components ships many translations; keep only the languages this app supports
        localeFilters = ['en', 'ja']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.android.material:material:1.12.0'
}
